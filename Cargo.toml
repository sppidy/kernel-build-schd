[package]
name = "kernel-builder"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "kbs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
